<style>
  /* ---- Notepad: the whole window is the editor. Built on the site's design tokens, without the site around it ---- */
  html, body { height: 100%; }
  body.np-app { overflow: hidden; background: var(--code-bg); font-size: 14px; line-height: 1.5; }
  body.np-app::before { display: none; }

  .np-shell { --np-z: 1; height: 100dvh; display: flex; flex-direction: column; background: var(--code-bg); }
  /* light theme: the panes are paper too (the site keeps code blocks dark, which hid plain text here), and the
     code colours are darker so they read on it */
  html[data-theme="light"] body.np-app, html[data-theme="light"] .np-shell { --code-bg: #fbfaf7; --code-border: rgba(15, 14, 20, .09); background: #fbfaf7; }
  html[data-theme="light"] .np-shell .tok-com { color: #8a8b95; }
  html[data-theme="light"] .np-shell .tok-str { color: #b4541a; }
  html[data-theme="light"] .np-shell .tok-num { color: #2c7a35; }
  html[data-theme="light"] .np-shell .tok-sym { color: #946200; }
  html[data-theme="light"] .np-shell .tok-kw  { color: #1f5fbf; }
  html[data-theme="light"] .np-shell .tok-fn  { color: #0b7680; }
  html[data-theme="light"] .np-shell .tok-op  { color: #8a3fd1; }
  html[data-theme="light"] .np-tip .tok-com { color: #8a8b95; } html[data-theme="light"] .np-tip .tok-str { color: #b4541a; }
  html[data-theme="light"] .np-tip .tok-num { color: #2c7a35; } html[data-theme="light"] .np-tip .tok-sym { color: #946200; }
  html[data-theme="light"] .np-tip .tok-kw  { color: #1f5fbf; } html[data-theme="light"] .np-tip .tok-fn  { color: #0b7680; }
  html[data-theme="light"] .np-tip .tok-op  { color: #8a3fd1; }

  /* top bar */
  .np-top {
    flex: none; display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px;
    border-bottom: 1px solid var(--border); background: var(--surface-solid);
  }
  .np-brand { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 9px 0 4px; border-radius: 8px; font: 600 .84rem var(--font-sans); color: var(--text); text-decoration: none; }
  .np-brand:hover { background: var(--surface-2); color: var(--text); }
  .np-brand svg { width: 18px; height: 18px; }
  .np-brand .np-back { width: 14px; height: 14px; color: var(--text-faint); margin-right: -2px; }
  .np-brand:hover .np-back { color: var(--text); }
  .np-site { display: flex; align-items: center; gap: 2px; }
  .np-site a { padding: 5px 9px; border-radius: 7px; font: 500 .8rem var(--font-sans); color: var(--text-dim); text-decoration: none; }
  .np-site a:hover { color: var(--text); background: var(--surface-2); }
  .np-file { display: inline-flex; align-items: baseline; gap: 9px; padding: 0 10px 0 4px; font: 500 .82rem var(--font-mono); color: var(--text); white-space: nowrap; }
  .np-saved { font: .7rem var(--font-sans); color: var(--text-faint); }
  .np-sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }
  .np-spacer { flex: 1 1 auto; }
  .np-tb {
    display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 9px;
    font: 500 .8rem var(--font-sans); color: var(--text-dim); cursor: pointer;
    background: transparent; border: 0; border-radius: 7px;
  }
  .np-tb:hover { color: var(--text); background: var(--surface-2); }
  .np-tb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .np-tb svg { width: 15px; height: 15px; flex: none; }
  .np-tb[disabled] { opacity: .45; cursor: not-allowed; }
  .np-run { margin-left: 6px; padding: 0 13px 0 11px; color: var(--accent-ink); font-weight: 600; background: var(--accent); }
  .np-run:hover { color: var(--accent-ink); background: var(--accent); filter: brightness(1.08); }
  .np-run.stop { background: var(--red); color: #fff; }
  .np-run kbd { font: 500 .66rem var(--font-mono); color: inherit; opacity: .7; background: transparent; border: 0; padding: 0; box-shadow: none; }
  .np-zoom { display: inline-flex; align-items: center; height: 30px; border-radius: 7px; overflow: hidden; }
  .np-zoom button { width: 26px; height: 100%; border: 0; background: transparent; cursor: pointer; color: var(--text-dim); font: 600 .9rem var(--font-sans); }
  .np-zoom button:hover { color: var(--text); background: var(--surface-2); }
  .np-zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .np-zoom button.val { width: auto; min-width: 42px; font: 500 .7rem var(--font-mono); }
  .np-top .icon-btn { width: 30px; height: 30px; border: 0; background: transparent; border-radius: 7px; }
  .np-top .icon-btn:hover { background: var(--surface-2); }

  /* examples menu */
  .np-menu-wrap { position: relative; }
  .np-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
    width: min(380px, calc(100vw - 24px)); max-height: min(480px, calc(100dvh - 70px)); overflow-y: auto;
    padding: 6px; border: 1px solid var(--border-strong); border-radius: 10px;
    background: var(--surface-solid); box-shadow: var(--shadow-lg);
  }
  .np-menu h6 { margin: 8px 11px 4px; font: 600 .64rem var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }
  .np-menu button {
    display: grid; gap: 2px; width: 100%; text-align: left; cursor: pointer;
    padding: 8px 11px; border: 0; border-radius: 7px; background: transparent; color: var(--text);
  }
  .np-menu button:hover, .np-menu button:focus-visible { background: var(--surface-2); outline: none; }
  .np-menu b { font: 500 .8rem var(--font-mono); color: var(--accent); }
  .np-menu span { font-size: .78rem; color: var(--text-dim); line-height: 1.45; }

  /* editor | divider | output, edge to edge */
  .np-split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, var(--np-left, 50%)) 7px minmax(0, 1fr); }
  .np-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .np-divider { position: relative; cursor: col-resize; touch-action: none; outline: none; }
  .np-divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: var(--border); transition: background .15s var(--ease); }
  .np-divider:hover::before, .np-divider.drag::before, .np-divider:focus-visible::before { left: 2px; width: 3px; background: var(--accent); }

  /* editor: transparent textarea over a highlighted mirror */
  .np-code { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--code-bg); }
  .np-gutter { overflow: hidden; padding: 14px 10px 14px 14px; text-align: right; user-select: none; }
  .np-gutter div, .np-hl, .np-ta { font-family: var(--font-mono); font-size: calc(13.5px * var(--np-z)); line-height: calc(22px * var(--np-z)); tab-size: 2; }
  .np-gutter div { color: var(--text-faint); opacity: .5; min-width: 2ch; }
  .np-gutter div.cur { color: var(--text-dim); opacity: 1; }
  .np-area { position: relative; overflow: hidden; }
  .np-hl, .np-ta {
    position: absolute; inset: 0; margin: 0; padding: 14px 18px 14px 8px; border: 0;
    white-space: pre; word-wrap: normal; letter-spacing: 0;
  }
  .np-hl { pointer-events: none; color: var(--text); overflow: hidden; background: none; }
  .np-hl code { display: block; font: inherit; background: none; border: 0; padding: 0; color: inherit; }
  .np-ta {
    width: 100%; height: 100%; resize: none; outline: none; overflow: auto;
    background: transparent; color: transparent; caret-color: var(--accent);
  }
  .np-ta::selection { background: var(--accent-glow); color: transparent; }

  /* output */
  .np-out { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0 18px; background: var(--code-bg); }
  .np-run-head {
    display: flex; align-items: center; gap: 10px; margin: 6px 16px 4px;
    font: 500 .68rem var(--font-mono); color: var(--text-faint);
  }
  .np-run-head::after { content: ""; flex: 1; height: 1px; background: var(--code-border); }
  .np-cell { padding: 6px 16px 8px 14px; border-left: 2px solid transparent; }
  .np-cell.err { border-left-color: var(--red); background: color-mix(in srgb, var(--red) 6%, transparent); }
  .np-res { font: calc(13px * var(--np-z))/1.6 var(--font-mono); color: var(--text); overflow-x: auto; }
  .np-txt { white-space: pre; line-height: 1.35; }
  /* Web fonts don't ship box-drawing, block or braille glyphs, and fallback fonts have other
     widths, so charts fall apart. Those characters are drawn as masks on an exact 1ch cell. */
  .gc {
    display: inline-block; width: 1ch; height: 1.35em; vertical-align: top; overflow: hidden;
    -webkit-text-fill-color: transparent; background: currentColor;
    -webkit-mask: var(--m) 0 0 / 100% 100% no-repeat; mask: var(--m) 0 0 / 100% 100% no-repeat;
  }
  .np-res .d { opacity: .62; } .np-res .b { font-weight: 600; } .np-res .i { font-style: italic; } .np-res .u { text-decoration: underline; }

  /* engine tables arrive as box-drawing text and are rebuilt as real tables */
  .np-res table.np-tbl {
    width: auto; margin: 2px 0 0; border-collapse: separate; border-spacing: 0;
    font: calc(13px * var(--np-z))/1.5 var(--font-mono); background: transparent;
    border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden;
  }
  .np-tbl th, .np-tbl td {
    padding: 2px 14px; white-space: pre; text-align: left; vertical-align: top;
    border: 0; border-bottom: 1px solid var(--code-border); background: transparent; color: var(--text);
  }
  .np-tbl th + th, .np-tbl td + td { border-left: 1px solid var(--code-border); }
  .np-tbl thead th { background: var(--surface-2); font-weight: 600; border-bottom-color: var(--border-strong); }
  .np-tbl tbody tr:last-child td { border-bottom: 0; }
  .np-tbl tbody tr:hover td { background: var(--surface); }
  .np-tbl .r { text-align: right; }
  .np-tbl-foot { margin-top: 5px; font-size: .7rem; color: var(--text-faint); }
  .np-note { margin: 8px 16px; font-size: .8rem; color: var(--text-faint); }
  .np-note.bad { color: var(--red); }
  .np-empty { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; color: var(--text-faint); font-size: .82rem; line-height: 1.7; }
  .np-empty strong { display: block; color: var(--text-dim); font-weight: 550; margin-bottom: 4px; }
  .np-empty kbd { font: 500 .72rem var(--font-mono); color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }

  /* status bar */
  .np-status {
    flex: none; display: flex; align-items: center; gap: 18px; height: 26px; padding: 0 12px;
    border-top: 1px solid var(--border); background: var(--surface-solid);
    font: .7rem var(--font-mono); color: var(--text-faint); white-space: nowrap; overflow: hidden;
  }
  .np-chip { display: inline-flex; align-items: center; gap: 7px; color: var(--text-dim); }
  .np-led { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
  .np-chip.booting .np-led { background: var(--accent); animation: npPulse 1.1s ease-in-out infinite; }
  .np-chip.ready .np-led { background: var(--green); }
  .np-chip.busy .np-led { background: var(--accent); animation: npPulse .7s ease-in-out infinite; }
  .np-chip.error .np-led { background: var(--red); }
  @keyframes npPulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .np-hide-sm { display: inline; }

  /* toast */
  .np-toast {
    position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); z-index: 60;
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px);
    padding: 9px 13px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--surface-solid); color: var(--text); box-shadow: var(--shadow-lg); font-size: .82rem;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
  }
  .np-toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .np-toast svg { width: 16px; height: 16px; color: var(--green); flex: none; }
  .np-toast input { min-width: 0; width: 280px; font: .75rem var(--font-mono); color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 7px; }

  /* hover a name: its k definition */
  .np-tip {
    position: fixed; z-index: 70; max-width: min(640px, calc(100vw - 16px)); padding: 8px 11px 9px;
    border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-solid); box-shadow: var(--shadow-lg);
    pointer-events: none;
  }
  .np-tip[hidden] { display: none; }
  .np-tip-name { font: 600 .74rem var(--font-mono); color: var(--accent); margin-bottom: 3px; }
  .np-tip-name i { font: italic 400 .7rem var(--font-sans); color: var(--text-faint); }
  .np-tip code { display: block; font: .78rem/1.5 var(--font-mono); color: var(--text); white-space: pre-wrap; word-break: break-all; background: none; border: 0; padding: 0; }

  /* narrow screens: editor above output, and the page scrolls */
  @media (max-width: 900px) {
    body.np-app { overflow: auto; }
    .np-shell { height: auto; min-height: 100dvh; }
    .np-top { position: sticky; top: 0; z-index: 20; }
    .np-split { grid-template-columns: minmax(0, 1fr); }
    .np-divider { display: none; }
    .np-code { height: 55dvh; min-height: 280px; flex: none; }
    .np-out { min-height: 40dvh; flex: none; border-top: 1px solid var(--border); }
    .np-hide-sm { display: none; }
    .np-zoom { display: none; }
    .np-site { display: none; }
  }
</style>
</head>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var editor = $("np-editor"), hl = $("np-hl"), gutter = $("np-gutter-inner"), out = $("np-out");
  var runBtn = $("np-run"), runLabel = $("np-run-label");
  var menu = $("np-menu"), exBtn = $("np-ex-btn"), toast = $("np-toast");
  var DRAFT_KEY = "amber-notepad-draft";

      note("Opened from a shared link — the snippet runs as soon as the engine is ready.");
      run(src);
    }, function () { note("That share link is damaged, so nothing was loaded.", true); loadDefault(); });
  } else loadDefault();
  startEngine();
})();
</script>
